<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Really Simple Modulo Calculator</title>

    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
            "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --card-bg: hsl(0 0% 100% / .9);
            --border:  hsl(0 0% 80%);
            --shadow:  0 20px 40px hsl(0 0% 0% / .15);
            --accent:  hsl(212 100% 48%);
        }

        /* Centered */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,
            hsl(220 15% 96%) 0%, hsl(220 20% 92%) 100%);
        }

        .card {
            width: clamp(260px, 80vw, 420px);
            padding: 2.5rem 3rem 2rem;
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(15px);
            text-align: center;
        }

        h1 { margin: 0 0 1.25rem; font-size: 1.5rem; }

        label {
            display: flex;
            flex-direction: column;
            gap: .25rem;
            margin: 1rem 0;
            font-weight: 500;
        }

        input[type="number"] {
            padding: .6rem .75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: .6rem;
            outline-offset: 2px;
        }

        button {
            appearance: none;
            border: none;
            padding: .7rem 1.4rem;
            margin: .3rem;
            border-radius: .6rem;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .12s ease;
        }

        button.primary { color: #fff; background: var(--accent); }
        button.secondary { background: hsl(210 15% 94%); color: hsl(210 10% 30%); }

        button:disabled { opacity: .45; cursor: default; }
        button:not(:disabled):active { transform: scale(.96); }

        #result { margin-top: 1.25rem; font-weight: 600; min-height: 1.4em; }

        /*History*/
        .history-wrapper {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            text-align: left;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: .75rem;
        }

        .history-header h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -.01em;
        }

        #historyList {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 10rem;
            overflow-y: auto;
            font-size: .9rem;
        }

        #historyList li {
            padding: .25rem 0;
            border-bottom: 1px solid hsl(0 0% 90%);
        }

        #historyList li:last-child { border-bottom: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Really Simple Modulo Calculator</h1>

    <label>
        Dividend
        <input type="number" id="dividend" placeholder="e.g. 37">
    </label>

    <label>
        Divisor
        <input type="number" id="divisor" placeholder="e.g. 5">
    </label>

    <div>
        <button id="calc" class="primary">Calculate</button>
        <button id="again" class="secondary" disabled>Again</button>
    </div>

    <div id="result"></div>

    <!-- History panel -->
    <div class="history-wrapper">
        <div class="history-header">
            <h2>History</h2>
            <button id="clearHistory" class="secondary" style="padding:.45rem .9rem;font-size:.8rem;">
                Reset&nbsp;History
            </button>
        </div>
        <ul id="historyList"></ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
